<!--
  Content-Security-Policy
  ------------------------------------------------------------------
  Bu politikanın <meta> ile verilmesinin nedeni GitHub Pages'in depo
  kodundan HTTP başlığı ayarlayamamasıdır. <meta> CSP'de şu yönergeler
  YOK SAYILIR ve bu yüzden burada bulunmazlar:

      frame-ancestors, report-uri, report-to, sandbox

  Clickjacking koruması bu nedenle başlık düzeyinde (Cloudflare ya da
  başka bir kenar katmanı) verilmelidir; app.js içindeki çerçeve kontrolü
  yalnızca bir alt sınırdır, başlığın yerini tutmaz.
  Ayrıntı ve hazır yapılandırma: docs/DEPLOYMENT-SECURITY.md

  'unsafe-inline' ve 'unsafe-eval' bilinçli olarak kullanılmadı: tüm
  betik ve biçimler ayrı dosyalara alındı, arayüzde hiçbir onclick=""
  ya da style="" niteliği yok. connect-src yalnızca projenin kendi
  Supabase uç noktasına açıktır.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  base-uri 'self';
  script-src 'self';
  style-src 'self';
  font-src 'self';
  img-src 'self' data:;
  connect-src 'self' https://ulwgkfulxqfeicjftqeb.supabase.co wss://ulwgkfulxqfeicjftqeb.supabase.co;
  form-action 'none';
  frame-src 'none';
  object-src 'none';
  manifest-src 'self';
  upgrade-insecure-requests
">
